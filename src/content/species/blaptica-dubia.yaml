family: Blaberidae
origin:
  pl: "Ameryka Południowa (Argentyna, Brazylia, Urugwaj)"
  en: "South America (Argentina, Brazil, Uruguay)"
size:
  pl: "40–45 mm"
  en: "40–45 mm"
temperature: 26–30 °C
