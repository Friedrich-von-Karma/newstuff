# Profil hodowlany – parametry do sprawdzenia przez hodowcę.
# Własne zdjęcia: wrzuć do public/images/species/hormetica-sp-colombia/ i dopisz w gallery.
latin: "Hormetica sp. \"Colombia\""
family: "Blaberidae"
origin:
  pl: "Kolumbia (dokładne stanowisko nieznane)"
  en: "Colombia (exact locality unknown)"
size:
  pl: "ok. 35–50 mm"
  en: "approx. 35–50 mm"
temperature: "22–26 °C"
humidity:
  pl: "wysoka, ok. 70%"
  en: "high, approx. 70%"
substrate:
  pl: "kilka cm włókna kokosowego z warstwą liści i kryjówkami; ok. 1/3 podłoża wilgotna"
  en: "several cm of coco fibre with leaf litter and hides; about 1/3 of the substrate kept damp"
food:
  pl: "sucha karma (np. dla psa lub kota), owoce, warzywa, suche liście"
  en: "dry food (e.g. dog or cat kibble), fruit, vegetables, dry leaves"
reproduction:
  pl: "jajożyworodny"
  en: "ovoviviparous"
development:
  pl: "kilka miesięcy do ok. roku"
  en: "several months to about a year"
difficulty: 2
climbs: false
flies: false
taxonomy:
  subfamily: "Blaberinae"
  tradeNames:
    - "Colombian horned roach"
sexing:
  adults:
    pl: "U rodzaju Hormetica samce mają wyraźne guzy i wyrostki na przedpleczu, samice gładsze przedplecze – dla tej formy niepotwierdzone na zdjęciach. Dorosłe obu płci mają skrzydła."
    en: "In the genus Hormetica males have distinct bumps and projections on the pronotum, females a smoother pronotum – not yet confirmed with photos for this form. Adults of both sexes are winged."
  nymphs:
    pl: "Nimfy: w ostatnich 2–3 stadiach po spodzie odwłoka – samica ma jedną dużą płytkę końcową, samiec węższą płytkę z 1–2 małymi segmentami za nią (często z drobnymi wyrostkami – stylikami). U młodszych nimf praktycznie nie do odróżnienia."
    en: "Nymphs: in the last 2–3 instars, check the underside of the abdomen – females have one large terminal plate, males a narrower plate with 1–2 small extra segments behind it (often with tiny styli). Not practical in young nymphs."
stages:
  pl: "Duże nimfy są ciemne i bezskrzydłe. Forma nieopisana naukowo – w hodowli europejskiej od kilku lat."
  en: "Large nymphs are dark and wingless. The form is scientifically undescribed and has been in European culture for a few years."
problems:
  - pl: "Nieudane ostatnie linienie i zdeformowane skrzydła – zwłaszcza po stresie transportu."
    en: "Failed final moults and deformed wings – especially after shipping stress."
  - pl: "W chłodzie rośnie bardzo wolno."
    en: "Grows very slowly when kept cool."
  - pl: "Mało danych hodowlanych – sprawdza się głębokie, wilgotne podłoże z butwiejącym drewnem i liśćmi."
    en: "Little husbandry data – deep, moist substrate with rotting wood and leaf litter works."
remark:
  pl: "Forma hodowlana bez nazwy gatunkowej; bywa łączona z H. apolinari, ale to tylko przypuszczenie."
  en: "A hobby form without a species name; sometimes linked to H. apolinari, but that is only speculation."
gallery: []
