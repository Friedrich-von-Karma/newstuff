# Profil hodowlany – parametry do sprawdzenia przez hodowcę.
# Własne zdjęcia: wrzuć do public/images/species/eublaberus-marajoara/ i dopisz w gallery.
latin: "Eublaberus marajoara"
author: "Rocha e Silva Albuquerque, 1972"
family: "Blaberidae"
origin:
  pl: "Brazylia (Amazonia)"
  en: "Brazil (Amazonia)"
size:
  pl: "ok. 45–55 mm"
  en: "approx. 45–55 mm"
temperature: "24–28 °C"
humidity:
  pl: "ok. 60–70%; część podłoża wilgotna, część sucha"
  en: "approx. 60–70%; part of the substrate damp, part dry"
substrate:
  pl: "głęboka warstwa (min. 5 cm) włókna kokosowego lub ziemi z liśćmi i korą"
  en: "a deep layer (at least 5 cm) of coco fibre or soil with leaves and bark"
food:
  pl: "owoce, warzywa, sucha karma, suche liście"
  en: "fruit, vegetables, dry food, dry leaves"
reproduction:
  pl: "jajożyworodny, ok. 20–30 nimf w miocie"
  en: "ovoviviparous, approx. 20–30 nymphs per litter"
development:
  pl: "ok. 5–12 miesięcy"
  en: "approx. 5–12 months"
difficulty: 1
climbs: false
flies: false
taxonomy:
  subfamily: "Blaberinae"
  tradeNames:
    - "ink splotch roach"
    - "Majora's Mask roach"
sexing:
  adults:
    pl: "Obie płcie mają długie skrzydła. Samce są smuklejsze; pewnie – po spodzie odwłoka."
    en: "Both sexes have long wings. Males are slimmer; reliably – by the underside of the abdomen."
  nymphs:
    pl: "Nimfy: w ostatnich 2–3 stadiach po spodzie odwłoka – samica ma jedną dużą płytkę końcową, samiec węższą płytkę z 1–2 małymi segmentami za nią (często z drobnymi wyrostkami – stylikami). U młodszych nimf praktycznie nie do odróżnienia."
    en: "Nymphs: in the last 2–3 instars, check the underside of the abdomen – females have one large terminal plate, males a narrower plate with 1–2 small extra segments behind it (often with tiny styli). Not practical in young nymphs."
stages:
  pl: "Nimfy mają szorstki, matowy pancerz, do którego przykleja się podłoże – inaczej niż błyszczące nimfy innych Eublaberus. Do dorosłości ok. roku. Dorosłe rzadziej kopią, siedzą w kryjówkach nad podłożem. Rysunek przedplecza jest zmienny."
  en: "Nymphs have a rough, matte exoskeleton that substrate sticks to – unlike the glossy nymphs of other Eublaberus. About a year to adulthood. Adults burrow less and sit in hides above the substrate. The pronotum pattern varies."
problems:
  - pl: "Rośnie i rozmnaża się wolniej niż inne Eublaberus."
    en: "Grows and breeds more slowly than other Eublaberus."
  - pl: "Potrzebuje więcej miejsca i stałego ciepła; w chłodzie słabnie."
    en: "Needs more space and steady warmth; does poorly when cool."
  - pl: "Ekipa sprzątająca (skórniki, pleśniakowce) potrafi się nadmiernie rozmnożyć."
    en: "Clean-up crews (dermestids, lesser mealworms) can get out of control."
