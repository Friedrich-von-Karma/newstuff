# Profil hodowlany – parametry do sprawdzenia przez hodowcę.
# Własne zdjęcia: wrzuć do public/images/species/aeluropoda-insignis/ i dopisz w gallery.
latin: "Aeluropoda insignis"
author: "Butler, 1882"
family: "Blaberidae"
origin:
  pl: "Madagaskar"
  en: "Madagascar"
size:
  pl: "ok. 40–65 mm"
  en: "approx. 40–65 mm"
temperature: "22–29 °C"
humidity:
  pl: "umiarkowana, ok. 60–70%; strefa wilgotna i sucha"
  en: "moderate, approx. 60–70%; a moist and a dry zone"
substrate:
  pl: "cienka warstwa podłoża, płaty kory i wytłoczki, dobra wentylacja; szczelna pokrywa lub pasek wazeliny – wspinają się po szkle"
  en: "a thin layer of substrate, bark slabs and egg crate, good ventilation; tight lid or a petroleum-jelly strip – they climb glass"
food:
  pl: "owoce, warzywa, sucha karma"
  en: "fruit, vegetables, dry food"
reproduction:
  pl: "jajożyworodny, ok. 10–20 nimf w miocie; rozmnaża się powoli"
  en: "ovoviviparous, approx. 10–20 nymphs per litter; breeds slowly"
development:
  pl: "ok. 6–7 miesięcy"
  en: "approx. 6–7 months"
difficulty: 2
climbs: true
flies: false
taxonomy:
  subfamily: "Oxyhaloinae"
  tribe: "Gromphadorhinini"
  tradeNames:
    - "flat-horned hisser"
sexing:
  adults:
    pl: "Obie płcie są bezskrzydłe. Samce są większe (ok. 7 cm wobec ok. 5 cm), bardzo płaskie, z głęboko wyciętym przednim brzegiem przedplecza – duże samce mają na końcach wycięcia płaskie „różki”. Samice mają gładkie przedplecze."
    en: "Both sexes are wingless. Males are larger (approx. 7 cm vs approx. 5 cm), very flat, with a deeply notched front edge of the pronotum – large males carry flat “horns” at the tips of the notch. Females have a smooth pronotum."
  nymphs:
    pl: "Nimfy: w ostatnich 2–3 stadiach po spodzie odwłoka – samica ma jedną dużą płytkę końcową, samiec węższą płytkę z 1–2 małymi segmentami za nią (często z drobnymi wyrostkami – stylikami). U młodszych nimf praktycznie nie do odróżnienia."
    en: "Nymphs: in the last 2–3 instars, check the underside of the abdomen – females have one large terminal plate, males a narrower plate with 1–2 small extra segments behind it (often with tiny styli). Not practical in young nymphs."
stages:
  pl: "Nimfy są płaskie, bezskrzydłe, bez ozdób na przedpleczu. Samce bywają bardzo różnej wielkości."
  en: "Nymphs are flat and wingless, without pronotal ornaments. Males vary a lot in size."
problems:
  - pl: "Rzadki w hodowli – mała pula genetyczna, drogie stado założycielskie."
    en: "Rare in culture – small gene pool and an expensive founder group."
  - pl: "W chłodzie i suchu rozmnaża się słabo; dobrze – w cieple i wilgoci."
    en: "Breeds poorly when cool and dry; well when warm and humid."
  - pl: "Roztocza zbożowe oznaczają, że jest za mokro."
    en: "Grain mites mean it is too wet."
gallery: []
