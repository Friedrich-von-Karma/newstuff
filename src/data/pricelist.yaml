# CENNIK – każda pozycja to jeden gatunek.
#  id:      unikalny identyfikator (najlepiej jak nazwa pliku profilu)
#  profile: nazwa pliku z src/content/species (bez .yaml) – tylko jeśli gatunek ma profil
#  status:  available (dostępne) | low (mało) | out (brak) | soon (wkrótce)
#  prices:  stage = L1 | L1-L2 | L2-L3 | L3-L4 | nymph | subadult | adult | male | female | pair | colony
#           price = cena w zł, per = za ile sztuk (domyślnie 1)
# Datę aktualizacji cennika zmienia się w src/data/site.ts
